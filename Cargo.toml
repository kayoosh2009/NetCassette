[package]
name = "netcassette"
version = "1.0.3"
edition = "2021"
authors = ["NetCassette Team"]
description = "Сетевой плеер и менеджер аудиопотоков в ретро-стиле кассетника"

[dependencies]
# UI фреймворк
slint = "1.9"

# Асинхронный движок
tokio = { version = "1.43", features = ["full"] }

# Сеть и потоковые данные
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
librqbit = "8"

# Аудио движок под Linux (ALSA / Pulse / PipeWire)
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }

# Linux / XDG интеграция и системный MPRIS
directories = "5.0"
notify-rust = "4.11"
zbus = "4.4"

# Сериализация и утилиты
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
slint-build = "1.9"